[project]
name = "uranium"
version = "0.1.0"
description = "Estudo comparativo de Engenharia de Software 3.0: pipeline multi-agente (LangGraph) contra agente único, com telemetria própria em JSONL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.0.0",
]
# Avaliador externo. Isolado do pipeline de propósito: o harness não importa
# nada de src/ e roda sem rede.
harness = [
    "jsonschema>=4.0.0",
    "radon>=6.0.0",
    "coverage>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
