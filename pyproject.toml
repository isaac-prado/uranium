[project]
name = "uranium"
version = "0.1.0"
description = "Pipeline multi-agente de Engenharia de Software 3.0 com LangGraph e LangSmith"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
